<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NEET UG R1 Schedule Widget</title>
  <style>
    :root {
      --bg: #090d16;
      --surface: #131b2e;
      --border: #22304d;
      --mcc: #38bdf8;
      --tn: #34d399;
      --text: #f8fafc;
      --muted: #94a3b8;
      --highlight: rgba(56, 189, 248, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 6px;
      margin: 0 auto;
      max-width: 540px;
      font-size: 11px;
      user-select: none;
    }

    /* Widget Header */
    .widget-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 6px 6px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 6px;
    }

    .widget-title {
      font-size: 11.5px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .dot {
      width: 6px;
      height: 6px;
      background: var(--tn);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--tn);
    }

    .btn-group {
      display: flex;
      gap: 4px;
    }

    .btn-icon {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 10px;
      cursor: pointer;
    }

    .btn-icon:hover {
      color: #fff;
      border-color: var(--muted);
    }

    /* Compact Table */
    .table-container {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 6px 7px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
      line-height: 1.25;
    }

    tr:last-child td {
      border-bottom: none;
    }

    /* Column Headers */
    th {
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      background: #0d1424;
    }

    th.col-stage { width: 34%; color: var(--muted); }
    th.col-mcc { width: 33%; color: var(--mcc); border-left: 1px solid var(--border); }
    th.col-tn { width: 33%; color: var(--tn); border-left: 1px solid var(--border); }

    /* Cells */
    td.stage-name {
      font-weight: 600;
      color: #e2e8f0;
      font-size: 11px;
    }

    td.cell-data {
      border-left: 1px solid var(--border);
    }

    .date {
      font-weight: 600;
      color: #fff;
      display: block;
      font-size: 11px;
    }

    .time-badge {
      font-size: 9.5px;
      color: var(--muted);
      display: block;
      margin-top: 1px;
    }

    /* Config Drawer (Collapsible) */
    #configPanel {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px;
      margin-bottom: 6px;
      font-size: 10px;
    }

    .config-field {
      margin-bottom: 6px;
    }

    .config-field label {
      display: block;
      color: var(--muted);
      margin-bottom: 2px;
    }

    .config-field input {
      width: 100%;
      background: #090d16;
      border: 1px solid var(--border);
      color: #fff;
      padding: 4px;
      border-radius: 4px;
      font-size: 10px;
    }

    .save-btn {
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 4px 8px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Widget Top Bar -->
  <div class="widget-bar">
    <div class="widget-title">
      <span class="dot"></span> NEET UG 2026 • Round 1
    </div>
    <div class="btn-group">
      <button class="btn-icon" onclick="toggleConfig()" title="Configure links">⚙️ Links</button>
      <button class="btn-icon" onclick="refreshSchedule()" title="Refresh">🔄</button>
    </div>
  </div>

  <!-- Settings Panel -->
  <div id="configPanel">
    <div class="config-field">
      <label>MCC Notice Link</label>
      <input type="text" id="mccLinkInput" />
    </div>
    <div class="config-field">
      <label>TN Notice Link</label>
      <input type="text" id="tnLinkInput" />
    </div>
    <div style="display:flex; justify-content: flex-end; gap: 4px;">
      <button class="save-btn" onclick="saveLinks()">Save & Apply</button>
    </div>
  </div>

  <!-- Compact Side-by-Side Table -->
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th class="col-stage">Stage</th>
          <th class="col-mcc">🏛️ MCC (AIQ)</th>
          <th class="col-tn">🏥 TN State</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <!-- Injected via JavaScript -->
      </tbody>
    </table>
  </div>

  <script>
    const DEFAULT_CONFIG = {
      mcc: "https://cdnbbsr.s3waas.gov.in/s3e0f7a4d0ef9b84b83b693bbf3feb8e6e/uploads/2026/08/202608131187512522.pdf",
      tn: "https://tnmedicalselection.net/news/12082026045717.pdf"
    };

    const SCHEDULE_ROWS = [
      {
        stage: "Registration & Fee",
        mccDate: "05 Aug – 15 Aug",
        mccTime: "Upto 02:00 PM (Pay till 5 PM)",
        tnDate: "06 Aug – 14 Aug",
        tnTime: "Upto 05:00 PM"
      },
      {
        stage: "Choice Filling & Lock",
        mccDate: "06 Aug – 17 Aug",
        mccTime: "Lock: 17 Aug (10 AM-6 PM)",
        tnDate: "15 Aug – 18 Aug",
        tnTime: "Locking: 18 Aug"
      },
      {
        stage: "Seat Processing",
        mccDate: "18 Aug",
        mccTime: "1 Day",
        tnDate: "19 Aug – 20 Aug",
        tnTime: "2 Days"
      },
      {
        stage: "Result",
        mccDate: "19 Aug",
        mccTime: "Provisional List",
        tnDate: "21 Aug",
        tnTime: "Provisional List"
      },
      {
        stage: "Allotment Order",
        mccDate: "19 Aug onwards",
        mccTime: "Online Portal",
        tnDate: "22 Aug onwards",
        tnTime: "Download & Pay Fee"
      },
      {
        stage: "College Joining",
        mccDate: "20 Aug – 25 Aug",
        mccTime: "Verify by 26 Aug",
        tnDate: "23 Aug – 27 Aug",
        tnTime: "Upto 05:00 PM"
      }
    ];

    function renderTable() {
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = "";

      SCHEDULE_ROWS.forEach(row => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td class="stage-name">${row.stage}</td>
          <td class="cell-data">
            <span class="date">${row.mccDate}</span>
            <span class="time-badge">${row.mccTime}</span>
          </td>
          <td class="cell-data">
            <span class="date">${row.tnDate}</span>
            <span class="time-badge">${row.tnTime}</span>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function toggleConfig() {
      const panel = document.getElementById("configPanel");
      panel.style.display = panel.style.display === "block" ? "none" : "block";
      document.getElementById("mccLinkInput").value = localStorage.getItem("mccLink") || DEFAULT_CONFIG.mcc;
      document.getElementById("tnLinkInput").value = localStorage.getItem("tnLink") || DEFAULT_CONFIG.tn;
    }

    function saveLinks() {
      localStorage.setItem("mccLink", document.getElementById("mccLinkInput").value.trim());
      localStorage.setItem("tnLink", document.getElementById("tnLinkInput").value.trim());
      toggleConfig();
      renderTable();
    }

    function refreshSchedule() {
      renderTable();
    }

    // Auto refresh every 15 minutes
    setInterval(renderTable, 15 * 60 * 1000);

    window.onload = renderTable;
  </script>
</body>
</html>
