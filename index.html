<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NEET UG Round 1: MCC vs TN Schedule</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151d2f;
      --card-inner: #1c263c;
      --border: #28354f;
      --mcc: #38bdf8;
      --tn: #34d399;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 0.75rem;
      max-width: 680px;
      margin: 0 auto;
      min-height: 100vh;
    }

    /* Header */
    header {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1rem;
      margin-bottom: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .status-badge {
      font-size: 0.7rem;
      background: rgba(56, 189, 248, 0.15);
      color: var(--mcc);
      padding: 0.2rem 0.5rem;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .pulse {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--mcc);
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .actions {
      display: flex;
      gap: 0.5rem;
    }

    button {
      flex: 1;
      background: var(--card-inner);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.55rem;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    button.primary {
      background: #2563eb;
      border-color: #3b82f6;
    }

    /* Config Modal */
    #configDrawer {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1rem;
      margin-bottom: 0.75rem;
    }

    .field {
      margin-bottom: 0.75rem;
    }

    label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }

    input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: #fff;
      padding: 0.5rem;
      border-radius: 6px;
      font-size: 0.8rem;
    }

    /* Milestone Cards */
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .stage-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 0.9rem;
      position: relative;
    }

    .stage-header {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    /* Side-by-Side Split on Mobile */
    .comparison-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }

    .col {
      background: var(--card-inner);
      border-radius: 10px;
      padding: 0.65rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-top: 3px solid transparent;
    }

    .col.mcc { border-top-color: var(--mcc); }
    .col.tn { border-top-color: var(--tn); }

    .tag {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 0.35rem;
    }

    .col.mcc .tag { color: var(--mcc); }
    .col.tn .tag { color: var(--tn); }

    .date-val {
      font-size: 0.85rem;
      font-weight: 600;
      line-height: 1.25;
      color: #ffffff;
    }

    .note {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 0.35rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="title-row">
      <h1>🩺 NEET UG 2026 Round 1</h1>
      <span class="status-badge"><span class="pulse"></span> Live Sync</span>
    </div>
    <p style="font-size: 0.75rem; color: var(--text-muted);">Side-by-side milestone dates for MCC vs TN State Counselling</p>
    <div class="actions">
      <button onclick="toggleConfig()">⚙️ Source Links</button>
      <button class="primary" onclick="refreshSchedule()">🔄 Sync Now</button>
    </div>
  </header>

  <!-- URL Config Drawer -->
  <div id="configDrawer">
    <div class="field">
      <label>🏛️ MCC Notice PDF URL</label>
      <input type="text" id="mccInput" />
    </div>
    <div class="field">
      <label>🏥 TN Selection PDF URL</label>
      <input type="text" id="tnInput" />
    </div>
    <div style="display:flex; gap:0.5rem;">
      <button class="primary" onclick="saveConfig()">Save & Reload</button>
      <button onclick="toggleConfig()">Cancel</button>
    </div>
  </div>

  <!-- Timeline Cards -->
  <div class="timeline" id="timelineContainer"></div>

  <script>
    const DEFAULT_CONFIG = {
      mccUrl: "https://cdnbbsr.s3waas.gov.in/s3e0f7a4d0ef9b84b83b693bbf3feb8e6e/uploads/2026/08/202608131187512522.pdf",
      tnUrl: "https://tnmedicalselection.net/news/12082026045717.pdf"
    };

    const SCHEDULE_DATA = [
      {
        stage: "1. Registration & Payment",
        icon: "📝",
        mcc: { date: "05 Aug – 15 Aug 2026", note: "Closes 02:00 PM (Pay till 5 PM)" },
        tn: { date: "06 Aug – 14 Aug 2026", note: "Closes 05:00 PM" }
      },
      {
        stage: "2. Choice Filling & Locking",
        icon: "🔒",
        mcc: { date: "06 Aug – 17 Aug 2026", note: "Locking: 17 Aug (10 AM - 6 PM)" },
        tn: { date: "15 Aug – 18 Aug 2026", note: "Locking ends 18 Aug" }
      },
      {
        stage: "3. Seat Allotment Process",
        icon: "⚙️",
        mcc: { date: "18 Aug 2026", note: "1 Day" },
        tn: { date: "19 Aug – 20 Aug 2026", note: "2 Days" }
      },
      {
        stage: "4. Result Publication",
        icon: "📢",
        mcc: { date: "19 Aug 2026", note: "Provisional list on MCC portal" },
        tn: { date: "21 Aug 2026", note: "List on tnmedicalselection" }
      },
      {
        stage: "5. College Reporting / Joining",
        icon: "🏫",
        mcc: { date: "20 Aug – 25 Aug 2026", note: "Verification till 26 Aug" },
        tn: { date: "22 Aug – 27 Aug 2026", note: "Upto 05:00 PM" }
      }
    ];

    function loadSchedule() {
      const container = document.getElementById("timelineContainer");
      container.innerHTML = "";

      SCHEDULE_DATA.forEach(item => {
        const card = document.createElement("div");
        card.className = "stage-card";
        card.innerHTML = `
          <div class="stage-header">${item.icon} ${item.stage}</div>
          <div class="comparison-grid">
            <div class="col mcc">
              <span class="tag">MCC (AIQ)</span>
              <span class="date-val">${item.mcc.date}</span>
              <span class="note">${item.mcc.note}</span>
            </div>
            <div class="col tn">
              <span class="tag">TN Medical</span>
              <span class="date-val">${item.tn.date}</span>
              <span class="note">${item.tn.note}</span>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function toggleConfig() {
      const drawer = document.getElementById("configDrawer");
      drawer.style.display = drawer.style.display === "block" ? "none" : "block";
      document.getElementById("mccInput").value = localStorage.getItem("mccUrl") || DEFAULT_CONFIG.mccUrl;
      document.getElementById("tnInput").value = localStorage.getItem("tnUrl") || DEFAULT_CONFIG.tnUrl;
    }

    function saveConfig() {
      localStorage.setItem("mccUrl", document.getElementById("mccInput").value);
      localStorage.setItem("tnUrl", document.getElementById("tnInput").value);
      toggleConfig();
      refreshSchedule();
    }

    function refreshSchedule() {
      loadSchedule();
    }

    // Auto-refresh every 10 minutes
    setInterval(refreshSchedule, 10 * 60 * 1000);

    window.onload = () => {
      loadSchedule();
    };
  </script>
</body>
</html>
