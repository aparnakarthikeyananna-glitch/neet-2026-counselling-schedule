<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NEET UG Schedule Widget</title>
  <style>
    :root {
      --bg: #090d16;
      --surface: #131b2e;
      --border: #22304d;
      --mcc: #38bdf8;
      --tn: #34d399;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 8px;
      margin: 0 auto;
      max-width: 600px;
      user-select: none;
    }

    .widget-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 8px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 8px;
    }

    .widget-title {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: var(--tn);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--tn);
    }

    .round-tag {
      background: rgba(56, 189, 248, 0.15);
      color: var(--mcc);
      font-size: 11px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .btn-icon {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 5px;
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
    }

    .btn-icon:hover { color: #fff; border-color: var(--muted); }

    .table-container {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 9px 10px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
      line-height: 1.3;
    }

    tr:last-child td { border-bottom: none; }

    th {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      background: #0d1424;
    }

    th.col-stage { width: 30%; color: var(--muted); }
    th.col-mcc { width: 35%; color: var(--mcc); border-left: 1px solid var(--border); }
    th.col-tn { width: 35%; color: var(--tn); border-left: 1px solid var(--border); }

    td.stage-name {
      font-weight: 600;
      color: #e2e8f0;
      font-size: 13.5px;
    }

    td.cell-data { border-left: 1px solid var(--border); }

    .date {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      display: block;
      letter-spacing: -0.2px;
    }

    .time-badge {
      font-size: 11px;
      color: var(--muted);
      display: block;
      margin-top: 3px;
      line-height: 1.2;
    }
  </style>
</head>
<body>

  <div class="widget-bar">
    <div class="widget-title">
      <span class="dot"></span>
      <span id="displayTitle">NEET UG 2026</span>
      <span class="round-tag" id="displayRound">Round 1</span>
    </div>
    <div>
      <button class="btn-icon" onclick="fetchSchedule()" title="Refresh Schedule">🔄</button>
    </div>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th class="col-stage">Stage</th>
          <th class="col-mcc" id="colMccHeader">🏛️ MCC (AIQ)</th>
          <th class="col-tn" id="colTnHeader">🏥 TN State</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="3" style="text-align:center; color:var(--muted); padding:20px;">Loading schedule data...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    async function fetchSchedule() {
      try {
        // Fetch schedule.json with cache buster
        const resp = await fetch('schedule.json?_t=' + new Date().getTime());
        if (!resp.ok) throw new Error('Network response not ok');
        const data = await resp.json();

        document.getElementById("displayTitle").textContent = data.title;
        document.getElementById("displayRound").textContent = data.round;
        document.getElementById("colMccHeader").textContent = `🏛️ MCC (${data.round})`;
        document.getElementById("colTnHeader").textContent = `🏥 TN (${data.round})`;

        const tbody = document.getElementById("tableBody");
        tbody.innerHTML = "";

        data.rows.forEach(r => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td class="stage-name">${r.stage}</td>
            <td class="cell-data">
              <span class="date">${r.mccDate}</span>
              <span class="time-badge">${r.mccTime}</span>
            </td>
            <td class="cell-data">
              <span class="date">${r.tnDate}</span>
              <span class="time-badge">${r.tnTime}</span>
            </td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        console.error("Failed to load schedule.json:", err);
      }
    }

    // Auto-refresh from schedule.json every 5 minutes
    setInterval(fetchSchedule, 5 * 60 * 1000);
    window.onload = fetchSchedule;
  </script>
</body>
</html>
