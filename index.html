<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NEET UG Schedule Widget</title>
  <style>
    :root {
      --bg: #090d16;
      --surface: #131b2e;
      --border: #22304d;
      --mcc: #38bdf8;
      --tn: #34d399;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 8px;
      margin: 0 auto;
      max-width: 600px;
      user-select: none;
    }

    /* Top Bar */
    .widget-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 8px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 8px;
    }

    .widget-title {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: var(--tn);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--tn);
    }

    .round-tag {
      background: rgba(56, 189, 248, 0.15);
      color: var(--mcc);
      font-size: 11px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .btn-group {
      display: flex;
      gap: 6px;
    }

    .btn-icon {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 5px;
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
    }

    .btn-icon:hover {
      color: #fff;
      border-color: var(--muted);
    }

    /* Table */
    .table-container {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 9px 10px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
      line-height: 1.3;
    }

    tr:last-child td {
      border-bottom: none;
    }

    th {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      background: #0d1424;
    }

    th.col-stage { width: 30%; color: var(--muted); }
    th.col-mcc { width: 35%; color: var(--mcc); border-left: 1px solid var(--border); }
    th.col-tn { width: 35%; color: var(--tn); border-left: 1px solid var(--border); }

    td.stage-name {
      font-weight: 600;
      color: #e2e8f0;
      font-size: 13.5px;
    }

    td.cell-data {
      border-left: 1px solid var(--border);
    }

    .date {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      display: block;
      letter-spacing: -0.2px;
    }

    .time-badge {
      font-size: 11px;
      color: var(--muted);
      display: block;
      margin-top: 3px;
      line-height: 1.2;
    }

    /* Config Panel */
    #configPanel {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
      font-size: 12px;
    }

    .config-field {
      margin-bottom: 8px;
    }

    .config-field label {
      display: block;
      color: var(--muted);
      margin-bottom: 4px;
      font-size: 11px;
    }

    .config-field input {
      width: 100%;
      background: #090d16;
      border: 1px solid var(--border);
      color: #fff;
      padding: 6px 8px;
      border-radius: 5px;
      font-size: 12px;
    }

    .config-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }

    .save-btn {
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 5px;
      padding: 6px 12px;
      font-weight: 600;
      cursor: pointer;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <!-- Top Widget Bar -->
  <div class="widget-bar">
    <div class="widget-title">
      <span class="dot"></span>
      <span id="displayMainTitle">NEET UG Counselling</span>
      <span class="round-tag" id="displayRoundTag">Round 1</span>
    </div>
    <div class="btn-group">
      <button class="btn-icon" onclick="toggleConfig()" title="Configure links & round">⚙️ Links</button>
      <button class="btn-icon" onclick="renderAll()" title="Refresh">🔄</button>
    </div>
  </div>

  <!-- Settings Configuration Drawer -->
  <div id="configPanel">
    <div class="config-field">
      <label>Counselling Round Name (Auto-derived from links or manual)</label>
      <input type="text" id="roundInput" placeholder="Auto-detected (e.g. Round 1, Round 2)" />
    </div>
    
    <div class="config-field">
      <label>🏛️ MCC Notice PDF Link</label>
      <input type="text" id="mccLinkInput" placeholder="https://..." oninput="autoDetectRound()" />
    </div>

    <div class="config-field">
      <label>🏥 TN Selection PDF Link</label>
      <input type="text" id="tnLinkInput" placeholder="https://..." oninput="autoDetectRound()" />
    </div>

    <div class="config-actions">
      <span style="font-size: 10.5px; color: var(--muted);" id="detectedFeedback"></span>
      <button class="save-btn" onclick="saveSettings()">Save & Update</button>
    </div>
  </div>

  <!-- Side-by-Side Comparison Table -->
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th class="col-stage">Stage</th>
          <th class="col-mcc" id="displayCol1Header">🏛️ MCC (AIQ)</th>
          <th class="col-tn" id="displayCol2Header">🏥 TN State</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <!-- Dynamic Schedule Rows -->
      </tbody>
    </table>
  </div>

  <script>
    const DEFAULT_CONFIG = {
      round: "Round 1",
      mccLink: "https://cdnbbsr.s3waas.gov.in/s3e0f7a4d0ef9b84b83b693bbf3feb8e6e/uploads/2026/08/202608131187512522.pdf",
      tnLink: "https://tnmedicalselection.net/news/12082026045717.pdf"
    };

    // Pre-structured database for rounds with exact milestone mappings
    const ROUNDS_DATABASE = {
      "Round 1": [
        { stage: "Registration & Fee", mccDate: "05 Aug – 15 Aug", mccTime: "Upto 02:00 PM (Pay till 5 PM)", tnDate: "13 Aug – 19 Aug", tnTime: "Upto 05:00 PM" },
        { stage: "Choice Filling & Lock", mccDate: "06 Aug – 17 Aug", mccTime: "Lock: 17 Aug (10 AM – 6 PM)", tnDate: "13 Aug – 19 Aug", tnTime: "Locking: 19 Aug (5 PM)" },
        { stage: "Seat Processing", mccDate: "18 Aug", mccTime: "1 Day", tnDate: "20 Aug", tnTime: "1 Day" },
        { stage: "Result", mccDate: "19 Aug", mccTime: "Provisional List", tnDate: "21 Aug", tnTime: "Provisional List" },
        { stage: "Allotment Order", mccDate: "19 Aug onwards", mccTime: "MCC Portal", tnDate: "22 Aug – 28 Aug", tnTime: "Upto 12:00 Noon" },
        { stage: "College Joining", mccDate: "20 Aug – 25 Aug", mccTime: "Verify by 26 Aug", tnDate: "23 Aug – 28 Aug", tnTime: "Upto 05:00 PM" }
      ],
      "Round 2": [
        { stage: "Registration & Fee", mccDate: "04 Sep – 09 Sep", mccTime: "Upto 12:00 Noon", tnDate: "11 Sep – 16 Sep", tnTime: "Upto 05:00 PM" },
        { stage: "Choice Filling & Lock", mccDate: "05 Sep – 10 Sep", mccTime: "Locking on 10 Sep", tnDate: "14 Sep – 17 Sep", tnTime: "Locking on 17 Sep" },
        { stage: "Seat Processing", mccDate: "11 Sep – 12 Sep", mccTime: "2 Days", tnDate: "18 Sep – 19 Sep", tnTime: "2 Days" },
        { stage: "Result", mccDate: "13 Sep", mccTime: "Provisional List", tnDate: "20 Sep", tnTime: "Provisional List" },
        { stage: "College Joining", mccDate: "14 Sep – 20 Sep", mccTime: "Verify by 21 Sep", tnDate: "21 Sep – 26 Sep", tnTime: "Upto 05:00 PM" }
      ],
      "Round 3": [
        { stage: "Registration & Fee", mccDate: "26 Sep – 02 Oct", mccTime: "Upto 12:00 Noon", tnDate: "03 Oct – 08 Oct", tnTime: "Upto 05:00 PM" },
        { stage: "Choice Filling & Lock", mccDate: "27 Sep – 03 Oct", mccTime: "Locking on 03 Oct", tnDate: "05 Oct – 09 Oct", tnTime: "Locking on 09 Oct" },
        { stage: "Seat Processing", mccDate: "04 Oct – 05 Oct", mccTime: "2 Days", tnDate: "10 Oct – 11 Oct", tnTime: "2 Days" },
        { stage: "Result", mccDate: "06 Oct", mccTime: "Provisional List", tnDate: "12 Oct", tnTime: "Provisional List" },
        { stage: "College Joining", mccDate: "07 Oct – 13 Oct", mccTime: "Verify by 14 Oct", tnDate: "13 Oct – 18 Oct", tnTime: "Upto 05:00 PM" }
      ],
      "Stray Vacancy": [
        { stage: "Choice Filling & Lock", mccDate: "16 Oct – 20 Oct", mccTime: "Locking on 20 Oct", tnDate: "22 Oct – 24 Oct", tnTime: "Locking on 24 Oct" },
        { stage: "Seat Processing", mccDate: "21 Oct – 22 Oct", mccTime: "2 Days", tnDate: "25 Oct", tnTime: "1 Day" },
        { stage: "Result", mccDate: "23 Oct", mccTime: "Provisional List", tnDate: "26 Oct", tnTime: "Provisional List" },
        { stage: "College Joining", mccDate: "24 Oct – 30 Oct", mccTime: "Final Joining", tnDate: "27 Oct – 31 Oct", tnTime: "Upto 05:00 PM" }
      ]
    };

    // Helper: auto-detects round based on URL string / PDF naming
    function detectRoundFromUrls(mccUrl, tnUrl) {
      const combined = (mccUrl + " " + tnUrl).toLowerCase();
      if (combined.includes("round-2") || combined.includes("round2") || combined.includes("r2")) return "Round 2";
      if (combined.includes("round-3") || combined.includes("round3") || combined.includes("r3") || combined.includes("mopup")) return "Round 3";
      if (combined.includes("stray")) return "Stray Vacancy";
      return "Round 1";
    }

    function getSettings() {
      const mccLink = localStorage.getItem("mccLink") || DEFAULT_CONFIG.mccLink;
      const tnLink = localStorage.getItem("tnLink") || DEFAULT_CONFIG.tnLink;
      const detected = detectRoundFromUrls(mccLink, tnLink);
      const round = localStorage.getItem("round") || detected;

      return {
        round,
        mccLink,
        tnLink,
        scheduleData: ROUNDS_DATABASE[round] || ROUNDS_DATABASE["Round 1"]
      };
    }

    function autoDetectRound() {
      const mccVal = document.getElementById("mccLinkInput").value;
      const tnVal = document.getElementById("tnLinkInput").value;
      const detected = detectRoundFromUrls(mccVal, tnVal);
      document.getElementById("roundInput").value = detected;
      document.getElementById("detectedFeedback").textContent = `Detected: ${detected}`;
    }

    function renderAll() {
      const cfg = getSettings();

      // Update Round Title & Tags
      document.getElementById("displayRoundTag").textContent = cfg.round;
      document.getElementById("displayCol1Header").textContent = `🏛️ MCC (${cfg.round})`;
      document.getElementById("displayCol2Header").textContent = `🏥 TN (${cfg.round})`;

      // Render Table Content
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = "";

      cfg.scheduleData.forEach(row => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td class="stage-name">${row.stage}</td>
          <td class="cell-data">
            <span class="date">${row.mccDate}</span>
            <span class="time-badge">${row.mccTime}</span>
          </td>
          <td class="cell-data">
            <span class="date">${row.tnDate}</span>
            <span class="time-badge">${row.tnTime}</span>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function toggleConfig() {
      const panel = document.getElementById("configPanel");
      panel.style.display = panel.style.display === "block" ? "none" : "block";

      const cfg = getSettings();
      document.getElementById("roundInput").value = cfg.round;
      document.getElementById("mccLinkInput").value = cfg.mccLink;
      document.getElementById("tnLinkInput").value = cfg.tnLink;
      document.getElementById("detectedFeedback").textContent = "";
    }

    function saveSettings() {
      const round = document.getElementById("roundInput").value.trim() || "Round 1";
      const mccLink = document.getElementById("mccLinkInput").value.trim() || DEFAULT_CONFIG.mccLink;
      const tnLink = document.getElementById("tnLinkInput").value.trim() || DEFAULT_CONFIG.tnLink;

      localStorage.setItem("round", round);
      localStorage.setItem("mccLink", mccLink);
      localStorage.setItem("tnLink", tnLink);

      toggleConfig();
      renderAll();
    }

    setInterval(renderAll, 15 * 60 * 1000);
    window.onload = renderAll;
  </script>
</body>
</html>
